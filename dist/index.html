He is in the first year of a BCA at Lovely Professional University, and has nine deployments to his name — PayPal Copilot, Amazn AI, Xpect AI, PulseMesh, a Hospital SQL dashboard, two from-scratch ML demos, Atlas Agent and the Atherva site itself.

His path: classical ML → SQL analytics → RAG → multi-tool agents → his own company, with every stage deployed rather than left in a notebook.`,chips:["What is Atherva?","Which apps are live?","Is he available?"]},{id:"skills",scope:"Skills",keywords:["version control","git","which language does he use","language does he code","best language","favorite language","favourite language","languages does he program","coding languages","programming languages","skill","skills","stack","tech stack","technologies","technology","tools","what does he know","what can he do","tech","expertise","proficient","languages","python","c++","cpp","c programming","scikit","sklearn","docker","aws","pytorch","langgraph","fastapi","streamlit","gemini","groq","litellm","smolagents","api","apis","rest","oauth","google sheets","prompt","prompt engineering","react","typescript","frontend","front end","tailwind","vite","framer motion","web development","website","web app","web apps","build a website","build websites","pydantic","asyncio","aiohttp","chromadb","sentence transformers","gradient boosting","knn","naive bayes","svm","ridge","lasso"],answer:`Ather's working stack, straight from the résumé:

• Languages — Python (advanced), C, C++, SQL
• Data — Pandas, NumPy, Matplotlib, Seaborn, EDA, data cleaning, feature engineering
• ML — scikit-learn, linear & logistic regression, KNN, Naive Bayes, SVM, Ridge, Lasso, decision trees, random forest, gradient boosting, gradient descent; PyTorch (learning)
• RAG & LLMs — FAISS, SentenceTransformers, Groq API (LiteLLM), Gemini API, ChromaDB, prompt engineering, semantic search
• Agents — smolagents (CodeAgent), Groq function calling, multi-tool orchestration, ReAct; LangGraph (learning)
• Backends — FastAPI, asyncio + aiohttp, Pydantic, Uvicorn, REST APIs, PayPal Sandbox + OAuth
• Web — React 19, TypeScript, Vite and Tailwind 4 power this portfolio; his main focus is the AI layer, not frontend
• Tooling — Streamlit Cloud, Render, Vercel, HuggingFace Spaces, pytest, Git/GitHub, gspread, PyMuPDF; Docker & AWS (learning)`,link:{label:"See the skills section",href:"#expertise"},chips:["RAG experience?","ML from scratch?","Which agents has he built?"]},{id:"rag",scope:"RAG",keywords:["how does rag work","how does retrieval work","retrieval work","rag stack","rag","retrieval","retrieval augmented","vector","vector database","faiss","chromadb","embedding","embeddings","semantic search","sentence transformers","sentencetransformers","chunking","chunks","all-minilm","llm","llms","model","models","gemini","groq","gpt-oss","litellm"],answer:`RAG is his main specialism — three shipped pipelines:

• Xpect AI — 8,807 Netflix titles embedded at 384 dims with all-MiniLM-L6-v2, FAISS exact top-5 search, and a system prompt that forbids answers outside retrieved context. Inference runs on Groq (openai/gpt-oss-20b); the OpenAI API itself is not used.
• Amazn AI — two independent FAISS indexes: 1,465 products, plus 476 chunks parsed from a 134-page support knowledge base with PyMuPDF.
• PayPal Copilot — policy RAG on FAISS so every dispute recommendation is grounded in policy text.

He also rebuilt Xpect's retrieval layer from ChromaDB + NLTK to FAISS with pure-Python preprocessing, and swapped Gemini 2.5 Flash for Groq for inference speed.`,link:{label:"Xpect AI on GitHub",href:"https://github.com/ather-ops/Xpect-AI"},chips:["Tell me about Xpect AI","How does Amazn AI route tools?","What about evaluation?"]},{id:"agents",scope:"Agentic AI",keywords:["agent","agents","agentic","multi tool","multitool","tool calling","function calling","smolagents","codeagent","react","langgraph","orchestration","autonomous","loop","off the rails","misbehave","stop the agent"],answer:`Agent work he has actually shipped:

• PayPal Copilot — a custom Groq function-calling loop (temperature 0.1, up to 5 tool rounds) with an explicit three-tool allowlist, so the model can never run arbitrary code.
• Amazn AI — a smolagents CodeAgent that routes each question to Product RAG, Support RAG or live order lookup, then chains tools into one answer. A 2-step fast agent falls back to a 10-step agent, with 3 retries and a 60-second timeout.
• Atlas Agent — an in-development smolagents assistant that plans and selects tools; date/time, system info and live weather work today, RAG memory is planned.

He completed Hugging Face's AI Agents course (smolagents, ReAct, tool use) and is learning LangGraph.`,chips:["PayPal Copilot details","Atlas Agent status","What is ReAct?"]},{id:"paypal",scope:"Project · PayPal Copilot",keywords:["oauth project","oauth 2","paypal agent","paypal","copilot","dispute","disputes","merchant","chargeback","fight","refund","escalate","oauth","sandbox","recommendation","recommendations"],answer:`PayPal Copilot — a merchant dispute agent.

• Pulls disputes from the PayPal Sandbox REST API with OAuth, token caching and error handling.
• Retrieves policy guidance with FAISS + all-MiniLM-L6-v2, then returns one of five structured recommendations: FIGHT, REFUND, OFFER, GATHER_MORE_EVIDENCE or ESCALATE — always for human review.
• Custom agent loop on Groq function calling: temperature 0.1, up to 5 tool rounds, three-tool allowlist.
• pytest tests cover auth, disputes, policy search and the agent itself; deployed on Streamlit Cloud.`,link:{label:"paypal-copilot on GitHub",href:"https://github.com/ather-ops/paypal-copilot"},chips:["How was it tested?","What is his RAG stack?","Show all projects"]},{id:"amazn",scope:"Project · Amazn AI",keywords:["google sheets agent","order agent","order automation","amazon project","amazn","amazon ai","amazn ai","multi tool agent","order lookup","product rag","support rag","google sheets","gspread","1465","476 chunks"],answer:`Amazn AI — a multi-tool agentic assistant.

• A smolagents CodeAgent routes every question to Product RAG, Support RAG or a live read-only Google Sheets order lookup, then chains the tools into a single answer (order status + return policy, for example).
• Two independent RAG pipelines and FAISS indexes: 1,465 products, and 476 chunks parsed from a 134-page Amazon-style support knowledge base with PyMuPDF.
• Adaptive execution: a 2-step fast agent with fallback to a 10-step agent, 3 retries and a 60-second timeout.
