yCz1Cj0lR1kzqj59yEtB8e/wCLxXgnwhfF4Id4b8QgmAlXeFu7J7pfclv3x+49kfpszo/uyB0w/aV7p/eb3SLvyyyy8LMzM85ZZ6ssg4yCNGV95EdcyCZ/lAU0fV/ayPYCZE6Pqd7My7+hD3kPeF83kZT7yn39TMzLMzMlllllllllllllnByQpIe8M97XzbfeW+934DjOD1vDwzPDMzzlnoyyz05ZZFnBxnqOD0ft6tmeGZmecsssssssssssssgssss4OM5P0d531PDwllllllllllllllllkHGR6M9BxnJ+izy85JZZZZZZZZZZZxllllllllllkWWcZzn6bw8JJZZJZxllnGWcZZZZZZZZwHpOD/4Hh9Gc5ZZZZZZZZZZZZZZzlllkFllnOWfoPOc5ZZZZZxlln6eWWWWWenOcss/TzjLOc4yySyzjLLLLLLLLLLLLLLLOMsssss4PRn6mWcZZZZZZZf/Z",uv=[{id:"intro",scope:"Profile",keywords:["who is ather","about ather","about you","about yourself","your background","introduce","introduction","your name","his name","tell me about him","summary","background","who are you","profile","bio"],answer:`Ather Assadullah Peer is an ML / AI engineer and the founder of Atherva Automations, an AI automation studio he started in 2026.

He is in the first year of a BCA at Lovely Professional University, and has nine deployments to his name — PayPal Copilot, Amazn AI, Xpect AI, PulseMesh, a Hospital SQL dashboard, two from-scratch ML demos, Atlas Agent and the Atherva site itself.

His path: classical ML → SQL analytics → RAG → multi-tool agents → his own company, with every stage deployed rather than left in a notebook.`,chips:["What is Atherva?","Which apps are live?","Is he available?"]},{id:"skills",scope:"Skills",keywords:["skill","skills","stack","tech stack","technologies","technology","tools","what does he know","what can he do","tech","expertise","proficient","languages","python","sql","pandas","numpy","scikit","sklearn","docker","aws","pytorch","langgraph","fastapi","streamlit","gemini","groq","litellm","smolagents","api","apis","rest","oauth","google sheets"],answer:`Ather's working stack, straight from the résumé:

• Languages — Python (advanced), C, C++, SQL
• Data — Pandas, NumPy, Matplotlib, Seaborn, EDA, data cleaning, feature engineering
• ML — scikit-learn, linear & logistic regression, KNN, Naive Bayes, SVM, Ridge, Lasso, decision trees, random forest, gradient boosting, gradient descent; PyTorch (learning)
• RAG & LLMs — FAISS, SentenceTransformers, Groq API (LiteLLM), Gemini API, ChromaDB, prompt engineering, semantic search
• Agents — smolagents (CodeAgent), Groq function calling, multi-tool orchestration, ReAct; LangGraph (learning)
• Tooling — FastAPI, REST APIs, PayPal Sandbox + OAuth, Streamlit Cloud, HuggingFace Spaces, Vercel, pytest, Git/GitHub, gspread, PyMuPDF; Docker & AWS (learning)`,link:{label:"See the skills section",href:"#expertise"},chips:["RAG experience?","ML from scratch?","Which agents has he built?"]},{id:"rag",scope:"RAG",keywords:["rag","retrieval","retrieval augmented","vector","vector database","faiss","chromadb","embedding","embeddings","semantic search","sentence transformers","sentencetransformers","chunking","chunks","all-minilm","llm","llms","model","models","gemini","groq","gpt-oss","litellm"],answer:`RAG is his main specialism — three shipped pipelines:

• Xpect AI — 8,807 Netflix titles embedded at 384 dims with all-MiniLM-L6-v2, FAISS exact top-5 search, and a system prompt that forbids answers outside retrieved context.
• Amazn AI — two independent FAISS indexes: 1,465 products, plus 476 chunks parsed from a 134-page support knowledge base with PyMuPDF.
• PayPal Copilot — policy RAG on FAISS so every dispute recommendation is grounded in policy text.

He also rebuilt Xpect's retrieval layer from ChromaDB + NLTK to FAISS with pure-Python preprocessing, and swapped Gemini 2.5 Flash for Groq for inference speed.`,link:{label:"Xpect AI on GitHub",href:"https://github.com/ather-ops/Xpect-AI"},chips:["Tell me about Xpect AI","How does Amazn AI route tools?","What about evaluation?"]},{id:"agents",scope:"Agentic AI",keywords:["agent","agents","agentic","multi tool","multitool","tool calling","function calling","smolagents","codeagent","react","langgraph","orchestration","autonomous","loop","off the rails","misbehave","stop the agent"],answer:`Agent work he has actually shipped:

• PayPal Copilot — a custom Groq function-calling loop (temperature 0.1, up to 5 tool rounds) with an explicit three-tool allowlist, so the model can never run arbitrary code.
• Amazn AI — a smolagents CodeAgent that routes each question to Product RAG, Support RAG or live order lookup, then chains tools into one answer. A 2-step fast agent falls back to a 10-step agent, with 3 retries and a 60-second timeout.
• Atlas Agent — an in-development smolagents assistant that plans and selects tools; date/time, system info and live weather work today, RAG memory is planned.

He completed Hugging Face's AI Agents course (smolagents, ReAct, tool use) and is learning LangGraph.`,chips:["PayPal Copilot details","Atlas Agent status","What is ReAct?"]},{id:"paypal",scope:"Project · PayPal Copilot",keywords:["paypal","copilot","dispute","disputes","merchant","chargeback","fight","refund","escalate","oauth","sandbox","recommendation","recommendations"],answer:`PayPal Copilot — a merchant dispute agent.

• Pulls disputes from the PayPal Sandbox REST API with OAuth, token caching and error handling.
• Retrieves policy guidance with FAISS + all-MiniLM-L6-v2, then returns one of five structured recommendations: FIGHT, REFUND, OFFER, GATHER_MORE_EVIDENCE or ESCALATE — always for human review.
• Custom agent loop on Groq function calling: temperature 0.1, up to 5 tool rounds, three-tool allowlist.
• pytest tests cover auth, disputes, policy search and the agent itself; deployed on Streamlit Cloud.`,link:{label:"paypal-copilot on GitHub",href:"https://github.com/ather-ops/paypal-copilot"},chips:["How was it tested?","What is his RAG stack?","Show all projects"]},{id:"amazn",scope:"Project · Amazn AI",keywords:["amazn","amazon ai","amazn ai","multi tool agent","order lookup","product rag","support rag","google sheets","gspread","1465","476 chunks"],answer:`Amazn AI — a multi-tool agentic assistant.

• A smolagents CodeAgent routes every question to Product RAG, Support RAG or a live read-only Google Sheets order lookup, then chains the tools into a single answer (order status + return policy, for example).
• Two independent RAG pipelines and FAISS indexes: 1,465 products, and 476 chunks parsed from a 134-page Amazon-style support knowledge base with PyMuPDF.
• Adaptive execution: a 2-step fast agent with fallback to a 10-step agent, 3 retries and a 60-second timeout.
• Built with Groq via LiteLLM and deployed on Streamlit — live at amazn-agentic-ai.streamlit.app.`,link:{label:"Amazn AI on GitHub",href:"https://github.com/ather-ops/Amazn-AI"},chips:["Xpect AI too?","PayPal Copilot?","Which tools can it call?"]},{id:"xpect",scope:"Project · Xpect AI",keywords:["xpect","cine sense","cinesense","movie","movies","film","netflix","8807","8,807","semantic movie","recommendation"],answer:`Xpect AI — semantic movie search with RAG.

• End-to-end RAG over 8,807 Netflix titles: 384-dim all-MiniLM-L6-v2 embeddings, FAISS exact top-5 search, and a system prompt that restricts answers to retrieved context.
• Shipped from zero to deployment in 15 days.
• The retrieval layer was rebuilt from scratch — ChromaDB + NLTK replaced with FAISS and lightweight pure-Python preprocessing — and the LLM moved from Gemini 2.5 Flash to Groq (openai/gpt-oss-20b) for speed.`,link:{label:"Xpect-AI on GitHub",href:"https://github.com/ather-ops/Xpect-AI"},chips:["What is his RAG stack?","Show all projects","Any live demos?"]},{id:"atlas",scope:"Project · Atlas Agent",keywords:["atlas","atlas agent","weather","openweather","gradio","in development"],answer:`Atlas Agent — an autonomous AI assistant, currently in development.

• Built on smolagents with the HF Inference API, Gradio and OpenWeather.
• The agent plans and selects tools; date/time, system info and live weather work today.
• RAG memory and multi-agent orchestration are the next milestones.

It is the one project he lists as unfinished, on purpose — the rest are deployed.`,link:{label:"atlas-agent on GitHub",href:"https://github.com/ather-ops/atlas-agent"},chips:["What is shipped?","How does he use smolagents?","Skills overview"]},{id:"atherva",scope:"Startup · Atherva Automations",keywords:["atherva","startup","company","founder","founded","own company","your company","his company","your startup","his startup","the startup","own startup","tell me about your startup","tell me about the startup","business","agency","automation agency","studio","services","clients","consulting","helloatherva"],answer:`Atherva Automations is Ather's own company, founded in 2026 in India — tagline: "Beyond automation. Into intelligent execution."

What it does:
• AI agents and agentic systems
• Business automation
• AI assistants and knowledge systems (RAG, semantic search)
• AI and data intelligence — analysis, dashboards, reporting, SQL analytics, forecasting

The process is six steps: Discover → Design → Build → Integrate → Test & Validate → Improve. Two products are in development: Alerti Intelligence (Shopify catalog monitoring) and Marketify (a planned open-source multi-agent marketing platform).

Clients get a 3–7 day free trial with no card, human-reviewed output and a free revision within 3 days. Site: atherva-automations.vercel.app · helloatherva@gmail.com.`,link:{label:"Visit Atherva Automations",href:Fe.url},chips:["What is Alerti?","What is Marketify?","Which apps are live?"]},{id:"alerti",scope:"Product · Alerti Intelligence",keywords:["alerti","alerti intelligence","shopify","price monitoring","product monitoring","stock alert","telegram alert","catalog","competitor tracking"],answer:`Alerti Intelligence is Atherva's first product, currently in development — there is no launch date yet.

It watches Shopify catalogues so a store owner does not have to: price changes, new products, stock movement and competitor activity, delivered as Telegram alerts with scheduled summaries.

It is built for e-commerce operators who need to react to a price change the same day, not at the end of the month. Because it is not released, it is described as in development on the Atherva site — no invented customers or results.`,link:{label:"See Alerti on the Atherva site",href:Fe.url},chips:["What is Atherva?","What is Marketify?","Show the live apps"]},{id:"marketify",scope:"Product · Marketify",keywords:["marketify","marketing","marketing platform","multi-agent marketing","campaign","open source marketing","crm","advertising"],answer:`Marketify is Atherva's second product and is still at the planned stage — it is not released.

The plan: an open-source, multi-agent marketing platform in Python with FastAPI and PostgreSQL, where specialist agents handle research, planning and drafting, and a human approves anything before it goes out. It is explicitly not a CRM and not a spam tool.

It is described as planned on the Atherva site, with no launch date and no invented users.`,link:{label:"See Marketify on the Atherva site",href:Fe.url},chips:["What is Atherva?","What is Alerti?","Show the live apps"]},{id:"live_apps",scope:"Live apps",keywords:["live","live apps","deployed","deployment","demo","demos","try","running","links","working app","which apps are live","streamlit","render"],answer:`Nine deployments, all linked from the Live apps section:

• Xpect AI — x-ai-test.streamlit.app
• Amazn AI — amazn-agentic-ai.streamlit.app
• PayPal Copilot — paypal-copilot-agenta.streamlit.app
• PulseMesh — pulsh-mesh.streamlit.app (API docs on Render)
• Hospital Management SQL — hospital-management--agent.streamlit.app
• House Price Predictor — the supervised-ML Streamlit app
• Spam Detector — spam-ai.streamlit.app
• Atlas Agent — under maintenance while it is rebuilt
• Atherva Automations — atherva-automations.vercel.app

Most Streamlit Community Cloud apps sleep after inactivity; the first visit wakes them in about 20 seconds. Every link comes from the repository READMEs, not from guesswork.`,link:{label:"Open the live apps section",href:"#live"},chips:["What is Atherva?","Tell me about PulseMesh","Which one is under maintenance?"]},{id:"pulsemesh",scope:"Project · PulseMesh",keywords:["pulsemesh","pulse mesh","pulse api","async","asyncio","aiohttp","concurrency","api aggregation","fastapi","render"],answer:`PulseMesh is an async API aggregation engine.

• asyncio and aiohttp fan out to many external APIs concurrently instead of one after another.
• Every request gets its own timeout, retry policy and error handling, so one failing provider does not sink the response.
• Results are normalized and validated with Pydantic into a single answer that reports success and failure counts.
• The backend is FastAPI running on Render, with a Streamlit front end on Streamlit Cloud, and published API docs.
